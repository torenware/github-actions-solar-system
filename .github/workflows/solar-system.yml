name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
    MONGO_USERNAME: superuser
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

permissions: 
    contents: read
    packages: write
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: "${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}"

    registry:
      name: Create Kind Cluster and Local Registry
      runs-on: ubuntu-latest
      outputs:
        registry_location: ${{ steps.kind.outputs.LOCAL_REGISTRY }}
      steps:
        - id: kind
          uses: helm/kind-action@v1
          with:
            registry: true
            registry_name: custom-registry
            registry_port: 5001
            kubectl_version: "v1.32.0"
            ignore_failed_clean: true      

    docker:
      name: Dockerize
      runs-on: ubuntu-latest

      needs:
        - unit-testing
        - registry

      env:
        #LOCAL_REGISTRY: ${{ needs.registry.outputs.registry_location }}
        LOCAL_REGISTRY: localhost:5001

      steps:
        - name: Install sources
          uses: actions/checkout@v4

        -
          name: Set up QEMU
          uses: docker/setup-qemu-action@v3
        # -
        #   name: Set up Docker Buildx
        #   uses: docker/setup-buildx-action@v3
        -
          name: Build for Test
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: ${{ env.LOCAL_REGISTRY }}/solar-system:${{ github.sha }}

        - name: image test
          run: |
            docker images
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ env.LOCAL_REGISTRY }}/solar-system:${{ github.sha }}

            echo "see if image returns expected live endpoint"
            wget -q -O - 127.0.0.1:3000/live | grep live

        - name: LOCAL_REGISTRY push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: | 
              ${{ env.LOCAL_REGISTRY }}/solar-system:${{ github.sha }}
              ${{ env.LOCAL_REGISTRY }}/solar-system:latest

    kind:
        name: Test K8s
        runs-on: ubuntu-latest
        needs:
        - docker
        - registry
        steps:
        - name: Pull image
          run: |
            # wait for DNS and run image
            sleep 60
            kubectl -n kube-system get pod
            kubectl run solar --image localhost:5001/solar-system:${{ github.sha }} \
               --pod-running-timeout 60s \
               --env MONGO_URI=${{ env.MONGO_URI}},MONGO_USERNAME=${{ env.MONGO_USERNAME}},MONGO_PASSWORD=${{ env.MONGO_PASSWORD}} \
            sleep 10
            kubectl logs solar
